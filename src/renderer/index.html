<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流式语音朗读</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <header class="topbar">
    <h1 data-i18n="appTitle">流式语音朗读</h1>
    <div class="prefs">
      <label class="inline">
        <span data-i18n="theme">主题</span>
        <select id="theme">
          <option value="system" data-i18n="themeSystem">跟随系统</option>
          <option value="light" data-i18n="themeLight">亮色</option>
          <option value="dark" data-i18n="themeDark">暗色</option>
        </select>
      </label>
      <label class="inline">
        <span data-i18n="uiLang">界面语言</span>
        <select id="uiLang">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </label>
    </div>
  </header>

  <section class="panel">
    <label for="text" data-i18n="textLabel">朗读文本</label>
    <textarea id="text"></textarea>
  </section>

  <section class="panel">
    <div class="grid">
      <div>
        <label for="lang" data-i18n="langLabel">语言</label>
        <select id="lang"></select>
      </div>
      <div>
        <label for="voice" data-i18n="voiceLabel">语音人物</label>
        <select id="voice"><option data-i18n="loading">加载中…</option></select>
      </div>
    </div>

    <div class="sliders">
      <div>
        <div class="slider-head">
          <label for="playRate" data-i18n="playRate">播放速度</label>
          <output id="playRateOut">1.00x</output>
        </div>
        <input id="playRate" type="range" min="0.5" max="2" step="0.05" value="1">
        <div class="hint" data-i18n="playRateHint"></div>
      </div>
      <div>
        <div class="slider-head">
          <label for="synthRate" data-i18n="synthRate">合成语速</label>
          <output id="synthRateOut">+0%</output>
        </div>
        <input id="synthRate" type="range" min="-50" max="100" step="5" value="0">
        <div class="hint" data-i18n="synthRateHint"></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="controls">
      <button id="playBtn" class="primary">朗读</button>
      <button id="pauseBtn" disabled>暂停</button>
      <button id="stopBtn" class="danger" disabled data-i18n="stop">停止</button>
      <button id="mp3Btn" data-i18n="downloadMp3" data-i18n-title="downloadMp3Title">下载 MP3</button>
      <button id="wavBtn" data-i18n="downloadWav" data-i18n-title="downloadWavTitle">下载 WAV</button>
      <span id="status"></span>
    </div>
    <div class="seek-row">
      <span id="timeCur" class="time">0:00</span>
      <div id="seek" class="disabled" role="slider" tabindex="0" data-i18n-aria-label="seekLabel"
           aria-valuemin="0" aria-valuenow="0">
        <div class="track"></div>
        <div class="buf" id="seekBuf"></div>
        <div class="played" id="seekPlayed"></div>
        <div class="thumb" id="seekThumb"></div>
      </div>
      <span id="timeTotal" class="time total">0:00</span>
    </div>
  </section>

  <section class="panel">
    <label data-i18n="segmentsLabel">分段</label>
    <ol id="segments"></ol>
  </section>

  <audio id="audio" hidden></audio>
</main>
<script src="i18n.js"></script>
<script src="wav.js"></script>
<script src="renderer.js"></script>
</body>
</html>
